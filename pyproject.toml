[project]
name = "claim-frequency-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline that predicts motor insurance claim frequency (freMTPL2freq)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Base dependencies, installed in both images. Image-specific packages go in the `trainer` and
# `api` dependency groups below. Airflow and its docker provider live only in the Airflow image,
# outside this project (ADR-0003).
dependencies = [
    "numpy",
    # Below 3.1: pandas 3.1 removed pandas.core.dtypes.common.infer_dtype_from_object, which
    # evidently 0.7.23 (the monitor's library, #20) imports, so `import evidently` fails
    # (https://github.com/evidentlyai/evidently/issues/1974). Drop the cap in the same PR that
    # raises evidently's lower bound to the first release with the fix.
    "pandas>=3,<3.1",
    "psycopg[binary]",  # PostgreSQL driver for MONITORING_DB_URL, needed by both images
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "scikit-learn",
    "sqlalchemy>=2",
]

[project.scripts]
claimfreq = "claimfreq.cli:main"

[dependency-groups]
# Test, lint, and analysis tools (matplotlib for scripts/eda.py), never installed in an image.
# API test dependencies (for example httpx, which FastAPI's TestClient needs) go here too.
dev = [
    "matplotlib>=3.11.2",
    "pytest",
    "ruff",
]
# Installed with the base dependencies in docker/trainer.Dockerfile (Role C). Role A adds
# dvc[s3] and httpx (for send-traffic); Role B adds mlflow, flaml[automl], lightgbm, xgboost,
# skops; Role D adds evidently. See docs/contracts.md, Images.
trainer = [
    "dvc[s3]>=3,<4",
    "evidently==0.7.23",
    "flaml[automl]>=2.8.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow==3.18.0",
    "skops>=0.16.0",
    "xgboost>=2.1.4",
]
# Installed with the base dependencies in docker/api.Dockerfile (Role D). Role D adds fastapi,
# uvicorn, mlflow-skinny, lightgbm, xgboost, skops.
api = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# One uv minor version for the whole team and CI, so nobody rewrites uv.lock in a different
# format. Upgrade with `uv self update`.
required-version = ">=0.13.9,<0.14"
# Only use uv-managed interpreters, so a system or Anaconda Python never leaks into .venv.
python-preference = "only-managed"
# A plain `uv sync` on a laptop installs every group. Images install one group only, with
# `uv sync --locked --no-default-groups --group trainer` (or `--group api`); CI uses
# `uv sync --locked --all-groups`.
default-groups = ["dev", "trainer", "api"]

[tool.uv.build-backend]
# The distribution is "claim-frequency-mlops", but the import package is "claimfreq".
module-name = "claimfreq"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Local stack (ADR-0008). Role C owns this file; docs/contracts.md (Environment variables,
# Images, Runtime, DAGs) lists every service and the values its clients use.
#
#   cp .env.example .env              # then fill in the required values
#   docker compose up -d              # postgres and mlflow: enough for development
#   open http://localhost:5001        # MLflow UI (5000 is macOS AirPlay)
#   docker compose up -d evidently-ui # Evidently UI, in the "monitoring" profile
#   open http://localhost:8001        # Evidently UI
#
# Airflow runs only on the demo machine, in the "airflow" profile (it also needs the Airflow
# keys in .env):
#   docker compose --profile tools build trainer   # the image every Airflow task runs
#   docker compose --profile airflow up -d
#   open http://localhost:8080        # Airflow UI (local only, no login)
#
# The fixed project name gives a predictable network, claim-frequency-mlops_default, which
# the Airflow DockerOperator tasks join.
name: claim-frequency-mlops

# Shared by every Airflow service (ADR-0003): the official image, which already ships the
# docker provider, with LocalExecutor and no Redis, Celery, or triggerer. The "airflow"
# profile keeps a plain `docker compose up` (and teammates without the Airflow keys) from
# starting it. The keys default to empty here, because compose interpolates every service
# even when its profile is off; airflow-init checks them instead.
x-airflow-common: &airflow-common
  profiles: ["airflow"]
  image: apache/airflow:3.4.0-python3.12
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # Every Airflow component must share the JWT secret of the execution API.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Local demo only: the UI is published on 127.0.0.1 and nobody has to log in.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # New DAGs start paused, so stub tasks do not fail every hour before they are implemented.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Read by the DAG files (dags/claimfreq_tasks.py) to configure the DockerOperator tasks.
    HOST_REPO_DIR: ${HOST_REPO_DIR:-}
    TRAINER_IMAGE: claimfreq-trainer:latest
    COMPOSE_NETWORK: claim-frequency-mlops_default
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      # -h 127.0.0.1: during first-start initialization Postgres listens on its Unix socket
      # only, so this turns healthy only after the three databases exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d monitoring"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    build:
      # The image copies nothing from the repo, so the build context is only docker/:
      # .env, .venv, and data never reach the Docker daemon.
      context: ./docker
      dockerfile: mlflow.Dockerfile
    image: claimfreq-mlflow:3.18.0
    # Artifacts are served by the server itself (--serve-artifacts is the default with
    # --artifacts-destination), so clients need no storage credentials. --allowed-hosts:
    # MLflow 3 rejects unknown Host headers; containers call it as http://mlflow:5000 and
    # the host as http://localhost:5001.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    # MLflow 3.18 also starts a job runner and 8 Huey consumer processes for its server-side
    # GenAI jobs (LLM-judge scoring, GenAI evaluation, prompt optimization, issue detection,
    # trace archival). The project uses none of them, and they hold 1.3-1.6 GiB, so they stay off.
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Monitoring dashboard (Role D; docs/contracts.md, Images). `claimfreq monitor` pushes one
  # Evidently snapshot per run to it, as http://evidently-ui:8000 inside compose. The image
  # version must equal evidently in uv.lock. Published on 8001, because the API uses 8000.
  # The "monitoring" profile keeps a plain `docker compose up` from starting it. Naming the
  # service turns the profile on, so `docker compose up -d evidently-ui` needs no --profile.
  evidently-ui:
    profiles: ["monitoring"]
    image: evidently/evidently-service:0.7.23
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # The image runs `evidently ui` in /app, which keeps its projects in /app/workspace.
      - evidently-workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/version')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot tool, not a long-running service: the "tools" profile keeps `docker compose up`
  # from starting it. Run a command with:
  #   docker compose run --rm trainer claimfreq <command>
  # The Airflow DockerOperator tasks run the same image (claimfreq-trainer:latest) with the
  # same mount and contract variables, set explicitly per task (dags/claimfreq_tasks.py).
  trainer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    image: claimfreq-trainer:latest
    working_dir: /repo
    volumes:
      - .:/repo
    # Compose values from docs/contracts.md (Environment variables). DATA_DIR and GIT_COMMIT
    # stay unset: data/ is under the mounted repo, and git reads the commit from .git.
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MONITORING_DB_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/monitoring
      API_URL: http://api:8000
      EVIDENTLY_UI_URL: http://evidently-ui:8000
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: checks the Airflow keys, creates or upgrades the metadata database, then exits.
  # The other Airflow services start only after it succeeds.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [ -z "$${AIRFLOW__CORE__FERNET_KEY}" ] || [ -z "$${AIRFLOW__API_AUTH__JWT_SECRET}" ] || [ -z "$${HOST_REPO_DIR}" ]; then
          echo "Set AIRFLOW_FERNET_KEY, AIRFLOW_JWT_SECRET, and HOST_REPO_DIR in .env (see .env.example)." >&2
          exit 1
        fi
        exec /entrypoint airflow db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # With LocalExecutor the tasks run here, so only the scheduler gets the Docker socket: its
  # DockerOperator tasks start sibling trainer containers on the host's Docker daemon.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mlflow-artifacts:
  airflow-logs:
  evidently-workspace:
